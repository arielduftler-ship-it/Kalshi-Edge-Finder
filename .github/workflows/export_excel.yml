name: Backfill Outcomes and Export Excel

on:
  workflow_dispatch: {}  # manual trigger only — run this whenever you want an updated spreadsheet

concurrency:
  group: daily-scan  # shares the lock with daily_scan.yml so they never run at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill outcomes from ESPN
        run: python backfill_outcomes.py

      - name: Commit updated outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_log.csv
          git diff --staged --quiet || git commit -m "Backfill outcomes $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Export to Excel
        run: python export_to_excel.py

      - name: Upload spreadsheet as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: data/predictions.xlsx
