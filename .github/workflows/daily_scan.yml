name: Daily Kalshi/Sportsbook Scan

on:
  schedule:
    # 13:00 UTC ≈ 8-9am ET, well before most game lines get volatile.
    # Cron uses UTC regardless of your local time zone.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

concurrency:
  group: daily-scan
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit the updated CSV back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily_scan.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_log.csv
          git diff --staged --quiet || git commit -m "Daily scan $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
